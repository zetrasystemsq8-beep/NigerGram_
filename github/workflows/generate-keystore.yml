name: Generate NigerGram Keystore (run once)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check if keystore already exists
        id: check
        run: |
          if [ -f "android/app/nigergram.jks" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if keystore already exists
        if: steps.check.outputs.exists == 'true'
        run: |
          echo "nigergram.jks already exists in the repo — refusing to overwrite it."
          echo "Delete it manually first if you really want to regenerate it."
          exit 1

      - name: Generate keystore
        if: steps.check.outputs.exists == 'false'
        run: |
          keytool -genkeypair \
            -v \
            -keystore android/app/nigergram.jks \
            -storepass nigergram123 \
            -keypass nigergram123 \
            -alias nigergram \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=NigerGram, OU=Zetra, O=Zetra, L=Lagos, ST=Lagos, C=NG"

      - name: Commit keystore to repo
        if: steps.check.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/nigergram.jks
          git commit -m "Add release signing keystore (generated once via workflow)"
          git push
