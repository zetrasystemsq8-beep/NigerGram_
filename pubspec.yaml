name: nigergram
description: "NigerGram - Professional Innovation Sharing Platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  go_router: ^14.8.1
  get_it: ^8.0.3
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7
  fpdart: ^1.1.0
  json_annotation: ^4.9.0
  lucide_icons_flutter: ^2.0.3
  firebase_core: ^3.13.0
  firebase_storage: ^12.4.4
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.4
  cloud_firestore: ^5.6.6
  video_player: ^2.9.5
  flutter_cache_manager: ^3.4.1
  preload_page_view: ^0.2.0
  cupertino_icons: ^1.0.8
  video_compress: ^3.1.2
  path_provider: ^2.0.14
  http: ^1.2.2
  url_launcher: ^6.1.10
  
  # Structural Additions (Aligned versions to resolve the web package conflict)
  cached_network_image: ^3.4.1
  share_plus: ^10.1.0
  uuid: ^4.5.1

  # NEW: Advanced Video Editing
  video_editor: ^3.0.0              # Professional video editing timeline
  
  # NEW: Audio Recording & Processing
  record: ^5.0.0                    # High-quality audio recording
  audioplayers: ^6.1.0              # Audio playback with control
  
  # NEW: Podcast & Metadata
  audio_session: ^0.1.15            # Audio session management
  
  # NEW: Waveform Visualization
  audio_waveforms: ^2.0.2           # Real-time waveform display
  
  # NEW: Text & Image Processing
  google_ml_kit: ^0.19.0            # ML Kit for text recognition & face detection
  image: ^4.1.0                     # Image processing
  
  # NEW: File Management
  file_picker: ^8.1.2               # File selection dialog
  
  # NEW: Notifications
  flutter_local_notifications: ^18.0.1  # Push notifications
  firebase_messaging: ^15.1.0       # Firebase Cloud Messaging
  
  # NEW: Permissions (FIXED VERSION)
  permission_handler: ^11.1.0       # Handle microphone, camera permissions
  
  # NEW: Network & API
  dio: ^5.4.0                       # HTTP client with interceptors
  connectivity_plus: ^5.0.1         # Check network connectivity

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  very_good_analysis: ^6.0.0

dependency_overrides:
  # record's Linux platform implementation (0.7.2) doesn't satisfy the
  # record_platform_interface version record itself pulls in — mismatch
  # causes compileFlutterBuildDebug to fail even on Android-only builds,
  # since Dart still compiles all federated platform implementations.
  # Not used at runtime for this app (Android target), just needs to compile.
  record_linux: ^1.1.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sounds/zetra_spoken.wav
    - assets/sounds/lv_732853827814200487_20260818020652.mp4
