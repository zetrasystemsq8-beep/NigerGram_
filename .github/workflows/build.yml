name: Build NigerGram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Automatic Storage Quota Purge
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const response = await github.rest.actions.listArtifactsForRepo({
              owner: owner,
              repo: repo,
              per_page: 100
            });
            const artifacts = response.data.artifacts;
            for (const artifact of artifacts) {
              if (artifact.name.includes('NigerGram')) {
                await github.rest.actions.deleteArtifact({
                  owner: owner,
                  repo: repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'

      - name: Inject google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > android/app/google-services.json

      - name: Fix package names
        run: |
          find lib -name "*.dart" -exec sed -i 's/package:flutter_video_feed/package:nigergram/g' {} +

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Build Release AAB
        run: flutter build appbundle --release --android-skip-build-dependency-validation

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NigerGram-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
          overwrite: true

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: NigerGram-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          overwrite: true

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: NigerGram-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          overwrite: true
