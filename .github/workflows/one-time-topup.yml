name: one-time-create-topup-config

on:
  workflow_dispatch:

jobs:
  create-topup-config:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configure Google credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > "$RUNNER_TEMP/firebase-key.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-key.json" >> "$GITHUB_ENV"

      - name: Install Firebase Admin SDK
        run: npm install firebase-admin --no-save --no-package-lock

      - name: Verify Firebase Admin SDK
        run: node -e "console.log(require.resolve('firebase-admin'))"

      - name: Create /config/topup
        env:
          PROJECT_ID: nigergram
        run: node scripts/create_topup_config.js
