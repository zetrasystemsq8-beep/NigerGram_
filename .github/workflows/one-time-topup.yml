name: one-time-create-topup-config
on:
  push:
    paths:
      - .github/workflows/one-time-topup.yml

permissions:
  contents: write

jobs:
  create-topup-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci
          fi

      - name: Run create_topup_config
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          PROJECT_ID: nigergram
        run: |
          node scripts/create_topup_config.js
