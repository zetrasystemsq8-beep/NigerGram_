name: Firebase Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Firebase Functions and Firestore Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure Google service account credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > "$GITHUB_WORKSPACE/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Functions dependencies
        working-directory: functions
        run: |
          if [ -f functions/package-lock.json ]; then
            cd functions && npm ci
          else
            cd functions && npm install
          fi

      - name: Install firebase-tools (local)
        run: npm install firebase-tools --no-save

      - name: Deploy Firebase Functions and Firestore Rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
        run: npx firebase-tools deploy --only functions,firestore:rules --non-interactive
