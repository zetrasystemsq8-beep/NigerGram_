name: Firebase Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Firebase Functions and Firestore Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Configure Google service account credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > "$GITHUB_WORKSPACE/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Deploy Firebase Functions and Firestore Rules
        run: firebase deploy --only functions,firestore:rules --non-interactive
