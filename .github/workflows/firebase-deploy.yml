name: Firebase Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Firebase Functions and Firestore Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@latest

      - name: Configure Google service account credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          echo "$GCP_SA_KEY" > "$GITHUB_WORKSPACE/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Install Functions dependencies
        working-directory: functions
        run: npm install

      - name: Locate firebase.json (if any) and set deploy directory
        id: find-firebase
        run: |
          # Try to find firebase.json in the repository
          set -e
          file=$(git ls-files -- "firebase.json" || true)
          if [ -n "$file" ]; then
            dir=$(dirname "$file")
            echo "Found firebase.json at: $file (deploy dir: $dir)"
            echo "FIREBASE_DIR=$dir" >> $GITHUB_ENV
          else
            echo "No firebase.json found in repository — Firebase configuration may be missing. Defaulting deploy directory to 'functions'." >&2
            echo "FIREBASE_DIR=functions" >> $GITHUB_ENV
          fi

      - name: Deploy Firebase Functions and Firestore Rules
        env:
          FIREBASE_DIR: ${{ env.FIREBASE_DIR }}
        run: |
          echo "Deploying from directory: ${FIREBASE_DIR:-.}"
          if [ -d "${FIREBASE_DIR}" ]; then
            cd "${FIREBASE_DIR}"
          else
            echo "WARNING: Deploy directory ${FIREBASE_DIR} does not exist; continuing from repository root" >&2
          fi

          # Run firebase deploy from the chosen directory
          firebase deploy --only functions,firestore:rules --non-interactive
